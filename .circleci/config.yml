version: 2.1

commands:
  restore_gradle_cache:
    steps:
      - restore_cache:
          key: &gradle_dependency_cache_key >-
            gradle-deps-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "settings.gradle" }}-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}-{{ checksum "app/gradle.lockfile" }}
      - restore_cache:
          key: builds-{{ .Revision }}
      - restore_cache:
          key: app-builds-{{ .Revision }}
jobs:
  build:
    working_directory: ~/droidFlyer
    docker:
      - image: cimg/android:2026.11.4
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Download Dependencies
          command: ./gradlew dependencies
      - run:
          name: Build
          command: ./gradlew assembleDebug assembleDebugUnitTest
      - save_cache:
          paths:
            - ~/.gradle
          key: *gradle_dependency_cache_key
      - save_cache:
          paths:
            - build
          key: builds-{{ .Revision }}
      - save_cache:
          paths:
            - app/build
          key: app-builds-{{ .Revision }}

  test:
    working_directory: ~/droidFlyer
    docker:
      - image: cimg/android:2026.11.4
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Run Tests
          command: ./gradlew jacoco
      - run:
          name: Report and enforce line coverage
          command: python3 scripts/ci/report-coverage.py app/build/reports/jacoco/jacoco/jacoco.xml
      - store_artifacts:
          path: app/build/reports/jacoco/jacoco
          destination: coverage
  deploy:
    working_directory: ~/droidFlyer
    docker:
      - image: cimg/android:2026.11.4
    resource_class: large
    environment:
      JVM_OPTS: -Xmx6g
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Publish APK
          command: ./gradlew publishReleaseApk

workflows:
  test-and-deploy:
    jobs:
      - build
      - test: { requires: [build] }
      - deploy:
          filters: pipeline.git.branch == "master"
          requires: [test]
