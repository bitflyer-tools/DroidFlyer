    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.4.21'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
    testImplementation('com.winterbe:expekt:0.5.0') { exclude group: 'org.jetbrains.kotlin' }
    testImplementation 'org.robolectric:robolectric:4.18.1'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // AGP resets jacoco.toolVersion when registering Android instrumentation transforms.
    jacocoAgent "org.jacoco:org.jacoco.agent:${coverageToolVersion}"
    jacocoAnt "org.jacoco:org.jacoco.ant:${coverageToolVersion}"
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

task jacoco(type: JacocoReport, dependsOn: "testDebugUnitTest") {
    description = "Generate Jacoco coverage reports after running tests."
    def kotlinClasses = providers.provider {
        tasks.named('compileDebugKotlin').get().destinationDirectory.get().asFile
    }
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(fileTree(dir: kotlinClasses, excludes: ['**/*$inlined$*.*']))
    sourceDirectories.from files('src/main/kotlin')
    executionData.from files('build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec')
}

static void writeCredential(Path path, String encoded) {
    byte[] decoded = encoded.decodeBase64()
    createPrivatePath(path, false)
    Files.write(path, decoded)
}

static void createPrivatePath(Path path, boolean directory) {
    if (Files.getFileStore(path.parent).supportsFileAttributeView('posix')) {
        def permissions = PosixFilePermissions.asFileAttribute(
                PosixFilePermissions.fromString(directory ? 'rwx------' : 'rw-------'))
        if (directory) Files.createDirectory(path, permissions)
        else Files.createFile(path, permissions)
        return
    }

    if (directory) Files.createDirectory(path)
    else Files.createFile(path)

    def acl = Files.getFileAttributeView(path, AclFileAttributeView)
    if (acl == null) throw new IOException('Cannot restrict access to release credentials')
    def ownerAccess = AclEntry.newBuilder()
            .setType(AclEntryType.ALLOW)
            .setPrincipal(acl.owner)
            .setPermissions(EnumSet.allOf(AclEntryPermission))
            .build()
    acl.setAcl([ownerAccess])
}
