import com.github.triplet.gradle.play.tasks.internal.PublishTaskBase

import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.attribute.AclEntry
import java.nio.file.attribute.AclEntryPermission
import java.nio.file.attribute.AclEntryType
import java.nio.file.attribute.AclFileAttributeView
import java.nio.file.attribute.PosixFilePermissions

plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '4.1.2'
    id 'jacoco'
}

def releaseKeystore = System.getenv('RELEASE_KEYSTORE_BASE64')
def playAccount = releaseKeystore == null ? null : System.getenv('PLAY_ACCOUNT_JSON_BASE64')
def credentialDirectory = new File(System.getProperty('java.io.tmpdir'), "droidflyer-release-${UUID.randomUUID()}")
def keystoreFile = new File(credentialDirectory, 'release.jks')
def playAccountFile = new File(credentialDirectory, 'play-account.json')

if (releaseKeystore != null) {
    gradle.buildFinished {
        Files.deleteIfExists(keystoreFile.toPath())
        Files.deleteIfExists(playAccountFile.toPath())
        Files.deleteIfExists(credentialDirectory.toPath())
    }

    // Both plugins need their file paths at configuration time, before the task graph is known.
    gradle.taskGraph.whenReady { graph ->
        if (gradle.startParameter.dryRun) return

        def needsKeystore = graph.allTasks.any {
            it.project == project && it.name in ['validateSigningRelease', 'signingReport']
        }
        def needsPlayAccount = playAccount != null &&
                graph.allTasks.any { it.project == project && it instanceof PublishTaskBase }

        if (needsKeystore || needsPlayAccount) {
            createPrivatePath(credentialDirectory.toPath(), true)
            if (needsKeystore) writeCredential(keystoreFile.toPath(), releaseKeystore)
            if (needsPlayAccount) writeCredential(playAccountFile.toPath(), playAccount)
        }
    }
}

def coverageToolVersion = '0.8.16'

android {
    compileSdk 37
    namespace 'com.unhappychoice.droidflyer'

    testCoverage {
        jacocoVersion = coverageToolVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlin {
        jvmToolchain(21)
    }
    signingConfigs {
        release {
            if (releaseKeystore != null) {
                storeFile keystoreFile
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEYSTORE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEYSTORE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            debuggable false
            testCoverageEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    defaultConfig {
        applicationId "com.unhappychoice.droidflyer"
        minSdk 23
        targetSdk 36
        versionCode System.getenv("CIRCLE_BUILD_NUM") as Integer ?: 1
        versionName "2.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        abortOnError false
        disable 'DuplicatePlatformClasses'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES.txt',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE',
                'META-INF/LICENSE',
                'META-INF/DEPENDENCIES',
                'META-INF/notice.txt',
                'META-INF/license.txt',
                'META-INF/dependencies.txt',
                'META-INF/LGPL2.1',
                'META-INF/rxjava.properties',
                'META-INF/rxkotlin.properties'
            ]
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                jacoco {
                    includeNoLocationClasses = true
                }
            }
        }
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enableUnitTest = true
    }
}

play {
    enabled = releaseKeystore != null
    if (playAccount != null) serviceAccountCredentials.set(playAccountFile)
}

dependencyLocking {
    lockAllConfigurations()
}

