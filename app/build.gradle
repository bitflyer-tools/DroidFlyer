    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.8.0"

    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation 'com.github.rahatarmanahmed:circularprogressview:2.5.0'
    implementation 'org.kodein.di:kodein-di:7.33.0'
    implementation 'com.github.unhappychoice:rxsnackbar:2.0.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.jakewharton.rxbinding4:rxbinding:4.0.0'
    implementation 'com.github.akarnokd:rxjava3-bridge:3.0.2'
    implementation 'com.pubnub:pubnub-gson:14.2.0'
    implementation 'com.squareup.flow:flow:1.0.0-alpha3'
    implementation 'com.squareup.mortar:mortar:0.20'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.1'
    implementation platform('com.squareup.retrofit2:retrofit-bom:3.0.0')
    implementation 'com.squareup.retrofit2:adapter-rxjava2'
    implementation 'com.squareup.retrofit2:retrofit'
    implementation 'com.squareup.retrofit2:converter-gson'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'
