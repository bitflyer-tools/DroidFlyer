pluginManagement {
    plugins {
        id 'com.android.application' version '9.5.2'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Maven Central rate-limits downloads of this Robolectric native runtime.
        exclusiveContent {
            forRepository {
                maven {
                    url = uri('https://maven-central.storage-download.googleapis.com/maven2')
                }
            }
            filter {
                includeVersion('org.robolectric', 'nativeruntime-dist-compat', '1.0.20')
            }
        }
        maven { url 'https://jitpack.io' }
    }
}

include ':app'
